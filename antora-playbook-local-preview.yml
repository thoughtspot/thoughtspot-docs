site:
  title: ThoughtSpot AgentSpot Preview
  url: http://localhost:5050
  start_page: agentspot::index.adoc
content:
  sources:
  - url: ./
    branches: HEAD
    start_paths:
      - agentspot/
urls:
  html_extension_style: drop
ui:
  bundle:
    url: ui-bundle/ui2-bundle.zip
  supplemental_files:
  - path: .nojekyll
  - path: ui.yml
    contents: "static_files: [ .nojekyll ]"
    snapshot: true
asciidoc:
  attributes:
    software: true
    cloud: false
    tabs: tabs
  extensions:
    - "@djencks/asciidoctor-tabset-block"
output:
  clean: true
  dir: build-preview
